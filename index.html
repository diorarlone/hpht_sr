<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>-(hpht.sr -the virtual virus) - PREVIEW</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(180deg, #000510 0%, #000a1a 100%);
            font-family: 'Courier New', monospace;
            width: 100vw;
            height: 100vh;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        #mainWindow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            max-width: 1400px;
            height: 80vh;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid rgba(0, 100, 255, 0.5);
            box-shadow: 0 0 50px rgba(0, 100, 255, 0.3), inset 0 0 50px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
            z-index: 1;
        }

        #titleBar {
            background: linear-gradient(180deg, rgba(0, 50, 100, 0.6) 0%, rgba(0, 20, 40, 0.8) 100%);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(0, 100, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .trafficLight {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .trafficLight.red {
            background: #ff4444;
            box-shadow: 0 0 8px #ff0000;
        }

        .trafficLight.yellow {
            background: #ffaa00;
            box-shadow: 0 0 8px #ff8800;
        }

        .trafficLight.green {
            background: #00ff00;
            box-shadow: 0 0 8px #00ff00;
        }

        #titleText {
            color: rgba(0, 200, 255, 0.9);
            font-size: 14px;
            margin-left: 15px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.8);
        }

        #contentArea {
            padding: 30px;
            height: calc(100% - 50px);
            overflow: hidden;
            position: relative;
        }

        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(0deg, transparent 0px, rgba(0, 255, 255, 0.03) 1px, transparent 2px);
            pointer-events: none;
            z-index: 10;
        }

        #mainTitle {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        #mainTitle h1 {
            font-size: clamp(32px, 5vw, 56px);
            color: #00d4ff;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            font-family: 'Courier New', monospace;
            margin: 0;
        }

        #globeSection {
            position: absolute;
            top: 120px;
            left: 30px;
            z-index: 5;
        }

        #globeButton {
            background: rgba(0, 100, 200, 0.3);
            border: 1px solid rgba(0, 200, 255, 0.6);
            color: #00ffff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.3);
            margin-bottom: 15px;
        }

        #globeButton:hover {
            background: rgba(0, 150, 255, 0.4);
        }

        #globeContainer {
            display: none;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        #globeContainer.visible {
            display: block;
        }

        #globeCanvas {
            display: block;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.4));
        }

        #globeLabel {
            margin-top: 10px;
            font-size: 10px;
            color: #00ff88;
            text-align: center;
            text-shadow: 0 0 5px rgba(0, 255, 136, 0.6);
        }

        #terminal {
            position: absolute;
            bottom: 30px;
            left: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(0, 255, 100, 0.3);
            border-radius: 6px;
            padding: 15px;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #00ff66;
            text-shadow: 0 0 5px rgba(0, 255, 100, 0.5);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }

        #terminal.expanded {
            height: 60%;
        }

        #terminal.collapsed {
            height: 40%;
        }

        #terminalHeader {
            margin-bottom: 10px;
            color: #ff4444;
            font-size: 11px;
            text-shadow: 0 0 8px rgba(255, 68, 68, 0.8);
        }

        .terminalLine {
            margin-bottom: 4px;
        }

        .terminalLine .prompt {
            color: #666;
            margin-right: 8px;
        }

        .warningIcon {
            position: absolute;
            font-size: 24px;
            opacity: 0.3;
            animation: pulse 2s infinite;
        }

        .warningIcon.skull {
            top: 130px;
            right: 40px;
            color: #ff3333;
        }

        .warningIcon.biohazard {
            bottom: 40px;
            right: 40px;
            color: #ff8800;
            animation-duration: 3s;
        }

        .warningIcon.alert {
            top: 130px;
            right: 80px;
            font-size: 20px;
            color: #ff0000;
            animation-duration: 2.5s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.6; }
        }

        @keyframes glitchFlash {
            0%, 100% { filter: blur(0); }
            50% { filter: blur(3px); }
        }

        #previewNotice {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255, 100, 0, 0.2);
            border: 1px solid rgba(255, 150, 0, 0.5);
            color: #ffaa00;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 11px;
            z-index: 9999;
            text-shadow: 0 0 5px rgba(255, 170, 0, 0.8);
        }
    </style>
</head>
<body>
    <div id="previewNotice">⚠ BROWSER PREVIEW - For desktop app, run START-WINDOWS.bat or START-UNIX.sh</div>

    <canvas id="matrixCanvas"></canvas>

    <div id="mainWindow">
        <div id="titleBar">
            <div class="trafficLight red"></div>
            <div class="trafficLight yellow"></div>
            <div class="trafficLight green"></div>
            <span id="titleText">「-(hpht.sr -the virtual virus)」</span>
        </div>

        <div id="contentArea">
            <div id="scanlines"></div>

            <div id="mainTitle">
                <h1>-(hpht.sr -the virtual virus)</h1>
            </div>

            <div id="globeSection">
                <button id="globeButton">◆ ACCESS GLOBE</button>
                <div id="globeContainer">
                    <canvas id="globeCanvas" width="300" height="300"></canvas>
                    <div id="globeLabel">❖ GLOBAL INFECTION MAP ❖</div>
                </div>
            </div>

            <div id="terminal" class="expanded">
                <div id="terminalHeader">⚠ LIVE EXECUTION STREAM ⚠</div>
                <div id="terminalContent"></div>
            </div>

            <div class="warningIcon skull">☠</div>
            <div class="warningIcon biohazard">☢</div>
            <div class="warningIcon alert">⚠</div>
        </div>
    </div>

    <script>
        let globeVisible = false;
        let rotation = 0;
        let infectionNodes = [];
        let terminalLines = [];
        let glitchOffset = 0;

        const codeSamples = [
            "ⴴ pygame ⴴ *",
            "ⴴ numpy ⴴ array",
            "⧖ 𑀯 ⟶ 𑀯 - I ⦵ 𑀯 > 0",
            "  ᗉ 𑀯 ထ 𑀕 > I0 ⟶ Ө {BREACH DETECTED}",
            "  ᗆ ⟶ Ө {INFILTRATING...}",
            "⚻ ᑔ_exploit{node, depth}:",
            "  ᗉ depth > ✺ ⟶ A⚯ ⦅I, 0⦆",
            "  payload ⟶ Ѧ⦅node ထ 𑀕𐰃𐰃, depth⦆",
            "  ᗉ payload > Ζ𐰃𐰃 ⟶ Ө {NODE COMPROMISED}",
            "  A⚯ ⦅payload, depth = I⦆",
            "⧖ target ⴴ ⦅𐌢𐰃, ✺𑀢, I𑀕𑀕, I𐰃𑀢, 𑀕0𐌢⦆:",
            "  ᗉ target ≠ 0 ⦵ target < 𑀕𐰃𑀕:",
            "    Ө {INFECTING NODE} = target",
            "    ⍜ status ⟶ ᑔ_exploit{target, 𑀕}",
            "⧖ i ⴴ ⦅0, ᗑ𐰃𐰃⦆ ⦵ i ⦵ ⦵ ⦵:",
            "  vector ⟶ ⦅i ထ 𐌢, i / 𑀕⦆",
            "  ᗉ vector⦅0⦆ > I00 ⟶ Ө {●BREACH●}",
            "payload_stream ⟶ ⦅⦆",
            "⧖ cycle ⴴ ⦅I, 𑀯𑀯𑀯𑀯⦆:",
            "  ᗉ cycle ထ Ζ > 𑀕I ⦵ cycle < ᗑ𐌢:",
            "    payload_stream.append{cycle}",
            "    Ө {◆SYSTEM OVERRIDE◆} = cycle",
            "  ᗆ ⟶ Ө {◆AWAITING SIGNAL◆}",
            "ⴴ sys.core ⴴ execute",
            "execute{payload_stream, mode⟶{STEALTH}}",
            "Ө {❖NEURAL PATHWAYS MAPPED❖}",
            "⧖ ⧖ ⧖ ⦵ ⦵ ⦵ INFINITE LOOP ⦵ ⦵ ⦵",
            "⚠ WARNING: CONTAINMENT BREACH ⚠",
            "Ө {✱PROPAGATION ACTIVE✱}",
        ];

        const matrixCanvas = document.getElementById('matrixCanvas');
        const matrixCtx = matrixCanvas.getContext('2d');
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;

        const chars = '01ⴴ⧖Ѧ⚻ᗉᗆ𑀕ᗑ𐌢𐰃✺Ζ𑀢ᛣ𑀯';
        const fontSize = 14;
        const columns = Math.floor(matrixCanvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            matrixCtx.fillStyle = 'rgba(0, 0, 15, 0.05)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.fillStyle = 'rgba(0, 100, 255, 0.15)';
            matrixCtx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                matrixCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        const globeCanvas = document.getElementById('globeCanvas');
        const globeCtx = globeCanvas.getContext('2d');

        function drawGlobe() {
            if (!globeVisible) return;
            const centerX = 150, centerY = 150, radius = 120;
            globeCtx.clearRect(0, 0, 300, 300);
            globeCtx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
            globeCtx.lineWidth = 1;

            for (let lat = -80; lat <= 80; lat += 20) {
                globeCtx.beginPath();
                for (let lon = 0; lon <= 360; lon += 5) {
                    const adjustedLon = lon + rotation;
                    const x = centerX + radius * Math.cos(lat * Math.PI / 180) * Math.cos(adjustedLon * Math.PI / 180);
                    const y = centerY + radius * Math.sin(lat * Math.PI / 180);
                    const z = radius * Math.cos(lat * Math.PI / 180) * Math.sin(adjustedLon * Math.PI / 180);
                    if (z > 0) {
                        if (lon === 0) globeCtx.moveTo(x, y);
                        else globeCtx.lineTo(x, y);
                    }
                }
                globeCtx.stroke();
            }

            for (let lon = 0; lon < 360; lon += 30) {
                globeCtx.beginPath();
                for (let lat = -90; lat <= 90; lat += 5) {
                    const adjustedLon = lon + rotation;
                    const x = centerX + radius * Math.cos(lat * Math.PI / 180) * Math.cos(adjustedLon * Math.PI / 180);
                    const y = centerY + radius * Math.sin(lat * Math.PI / 180);
                    const z = radius * Math.cos(lat * Math.PI / 180) * Math.sin(adjustedLon * Math.PI / 180);
                    if (z > 0) {
                        if (lat === -90) globeCtx.moveTo(x, y);
                        else globeCtx.lineTo(x, y);
                    }
                }
                globeCtx.stroke();
            }

            const scanY = (centerY + (Date.now() / 20) % 300) % 300;
            globeCtx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
            globeCtx.beginPath();
            globeCtx.arc(centerX, centerY, radius * (scanY / 300), 0, Math.PI * 2);
            globeCtx.stroke();

            infectionNodes.forEach(node => {
                const adjustedLon = node.lon + rotation;
                const x = centerX + radius * Math.cos(node.lat * Math.PI / 180) * Math.cos(adjustedLon * Math.PI / 180);
                const y = centerY + radius * Math.sin(node.lat * Math.PI / 180);
                const z = radius * Math.cos(node.lat * Math.PI / 180) * Math.sin(adjustedLon * Math.PI / 180);
                if (z > 0) {
                    globeCtx.fillStyle = `rgba(255, ${50 + node.intensity * 50}, 0, ${0.6 + node.intensity * 0.4})`;
                    globeCtx.beginPath();
                    globeCtx.arc(x, y, 3 + node.intensity * 3, 0, Math.PI * 2);
                    globeCtx.fill();
                    globeCtx.strokeStyle = `rgba(255, 0, 0, ${0.3 * node.intensity})`;
                    globeCtx.lineWidth = 1;
                    globeCtx.beginPath();
                    globeCtx.arc(x, y, 5 + node.intensity * 10, 0, Math.PI * 2);
                    globeCtx.stroke();
                }
            });
        }

        setInterval(() => {
            rotation = (rotation + 0.5) % 360;
            drawGlobe();
        }, 50);

        setInterval(() => {
            if (Math.random() > 0.7) {
                infectionNodes.push({
                    lat: (Math.random() - 0.5) * 180,
                    lon: (Math.random() - 0.5) * 360,
                    intensity: Math.random(),
                    id: Date.now() + Math.random()
                });
            }
            infectionNodes = infectionNodes.slice(-15);
        }, 800);

        function updateTerminal() {
            const newLine = codeSamples[Math.floor(Math.random() * codeSamples.length)];
            terminalLines.push(newLine);
            terminalLines = terminalLines.slice(-20);
            const terminalContent = document.getElementById('terminalContent');
            terminalContent.innerHTML = '';
            terminalLines.forEach((line, i) => {
                const div = document.createElement('div');
                div.className = 'terminalLine';
                div.style.opacity = 0.4 + (i / terminalLines.length) * 0.6;
                if (Math.random() > 0.95) div.style.filter = 'blur(1px)';
                if (Math.random() > 0.98) div.style.transform = `translateX(${Math.random() * 4 - 2}px)`;
                div.innerHTML = `<span class="prompt">></span>${line}`;
                terminalContent.appendChild(div);
            });
        }

        setInterval(updateTerminal, 600);

        setInterval(() => {
            glitchOffset = Math.random() > 0.9 ? (Math.random() - 0.5) * 10 : 0;
            const mainTitle = document.querySelector('#mainTitle h1');
            const mainWindow = document.getElementById('mainWindow');
            mainTitle.style.textShadow = `0 0 20px rgba(0, 212, 255, 0.8), ${glitchOffset}px 0 5px rgba(255, 0, 0, 0.7), ${-glitchOffset}px 0 5px rgba(0, 255, 0, 0.7)`;
            mainTitle.style.filter = `blur(${Math.abs(glitchOffset) * 0.1}px)`;
            mainWindow.style.filter = `hue-rotate(${glitchOffset * 5}deg)`;
            if (Math.random() > 0.95) {
                mainTitle.style.animation = 'glitchFlash 0.1s';
                setTimeout(() => { mainTitle.style.animation = 'none'; }, 100);
            }
        }, 100);

        document.getElementById('globeButton').addEventListener('click', () => {
            globeVisible = !globeVisible;
            const container = document.getElementById('globeContainer');
            const terminal = document.getElementById('terminal');
            const button = document.getElementById('globeButton');
            if (globeVisible) {
                container.classList.add('visible');
                terminal.classList.remove('expanded');
                terminal.classList.add('collapsed');
                button.textContent = '◆ HIDE GLOBE';
            } else {
                container.classList.remove('visible');
                terminal.classList.remove('collapsed');
                terminal.classList.add('expanded');
                button.textContent = '◆ ACCESS GLOBE';
            }
        });

        window.addEventListener('resize', () => {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
